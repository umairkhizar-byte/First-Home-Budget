<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home Budget">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Home Budget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0f1117;
    --card: #181c27;
    --card2: #1e2333;
    --border: #2a3045;
    --accent: #6c8fff;
    --accent2: #a78bfa;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #e8eaf0;
    --muted: #7a8099;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1a1f35 0%, #0f1117 100%);
    border-bottom: 1px solid var(--border);
    padding: calc(14px + var(--safe-top)) 16px 14px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .header h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--text); }
  .header h1 span { color: var(--accent); }

  /* MONTH NAV */
  .month-nav {
    display: flex; align-items: center; justify-content: center; gap: 0;
    background: var(--card2); border: 1px solid var(--border); border-radius: 40px;
    overflow: hidden;
  }
  .month-nav button {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 1.1rem; padding: 8px 18px; touch-action: manipulation;
  }
  .month-label { font-size: 0.88rem; font-weight: 600; color: var(--text); min-width: 130px; text-align: center; }

  /* SUMMARY CARDS */
  .summary-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 16px; }
  .sum-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 10px; text-align: center;
  }
  .sum-card .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 5px; }
  .sum-card .amount { font-size: 1.1rem; font-weight: 700; font-family: 'Playfair Display', serif; }
  .sum-card.income .amount { color: var(--green); }
  .sum-card.expenses .amount { color: var(--red); }
  .sum-card.balance .amount { color: var(--accent); }

  /* MAIN */
  .main { padding: 0 12px 100px; display: flex; flex-direction: column; gap: 14px; }

  /* SECTION */
  .section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .section-header h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; }
  .section-header .section-total { font-size: 0.95rem; font-weight: 700; }
  .section-header .chevron { color: var(--muted); font-size: 0.75rem; transition: transform 0.3s; margin-left: 8px; }
  .section-header.collapsed .chevron { transform: rotate(-90deg); }
  .section-body.collapsed { display: none; }

  /* ROWS */
  .row { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .row-label { flex: 1; font-size: 0.84rem; color: var(--text); min-width: 0; }
  .row-label input[type="text"] {
    background: none; border: none; color: var(--text); font-size: 0.84rem;
    font-family: 'Inter', sans-serif; width: 100%; outline: none; border-bottom: 1px solid transparent;
  }
  .row-label input[type="text"]:focus { border-bottom-color: var(--accent); }
  .amount-input {
    background: var(--card2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 0.84rem; font-family: 'Inter', sans-serif;
    padding: 6px 8px; width: 110px; text-align: right; outline: none;
  }
  .amount-input:focus { border-color: var(--accent); }
  .row-delete { background: none; border: none; color: var(--border); cursor: pointer; font-size: 1rem; padding: 6px; border-radius: 4px; }
  .row-delete:active { color: var(--red); }

  /* ADD BTN */
  .add-row-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; color: var(--muted); font-size: 0.8rem;
    cursor: pointer; border: none; background: none; font-family: 'Inter', sans-serif; width: 100%;
  }
  .add-row-btn:active { color: var(--accent); }

  /* TABS */
  .tabs-row { display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; border-bottom: 1px solid var(--border); scrollbar-width: none; }
  .tabs-row::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: var(--card2); border: 1px solid var(--border); border-radius: 20px;
    color: var(--muted); font-size: 0.75rem; padding: 5px 12px; cursor: pointer;
    white-space: nowrap; font-family: 'Inter', sans-serif; font-weight: 500;
  }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* BALANCE BOX */
  .balance-box {
    background: linear-gradient(135deg, #1e2a4a, #1a1f35);
    border: 1px solid var(--accent); border-radius: var(--radius);
    padding: 20px 18px;
  }
  .balance-box h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent2); margin-bottom: 4px; }
  .balance-box p { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; }
  .balance-box .bal-amount { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: var(--accent); }
  .balance-box .bal-amount.negative { color: var(--red); }

  /* CHART */
  .chart-section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .chart-section h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; margin-bottom: 14px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .bar-label { font-size: 0.7rem; color: var(--muted); width: 110px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; background: var(--card2); border-radius: 4px; height: 9px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .bar-val { font-size: 0.68rem; color: var(--muted); width: 65px; text-align: right; }

  /* NOTES */
  .notes-wrap { padding: 10px 14px; }
  .notes-area {
    background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 0.8rem; color: var(--muted);
    font-family: 'Inter', sans-serif; width: 100%; resize: none; min-height: 56px; outline: none;
  }
  .notes-area:focus { border-color: var(--accent); color: var(--text); }

  /* INSTALL BANNER */
  #installBanner {
    display: none; position: fixed; bottom: calc(16px + var(--safe-bot)); left: 16px; right: 16px;
    background: var(--accent); color: #fff; border-radius: 14px;
    padding: 14px 18px; z-index: 999; box-shadow: 0 8px 32px rgba(108,143,255,0.4);
    align-items: center; justify-content: space-between; gap: 10px;
  }
  #installBanner.show { display: flex; }
  #installBanner p { font-size: 0.82rem; font-weight: 500; flex: 1; }
  #installBanner button { background: #fff; color: var(--accent); border: none; border-radius: 8px; padding: 7px 14px; font-weight: 700; font-size: 0.82rem; cursor: pointer; }
  #dismissBtn { background: none; color: rgba(255,255,255,0.7); font-size: 1.1rem; padding: 4px 6px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>Home <span>Budget</span></h1>
  </div>
  <div class="month-nav">
    <button onclick="changeMonth(-1)" aria-label="Previous month">&#8592;</button>
    <div class="month-label" id="monthLabel"></div>
    <button onclick="changeMonth(1)" aria-label="Next month">&#8594;</button>
  </div>
</div>

<div class="summary-row">
  <div class="sum-card income"><div class="label">Income</div><div class="amount" id="totalIncome">0</div></div>
  <div class="sum-card expenses"><div class="label">Expenses</div><div class="amount" id="totalExpenses">0</div></div>
  <div class="sum-card balance"><div class="label">Balance</div><div class="amount" id="totalBalance">0</div></div>
</div>

<div class="main">

  <!-- INCOME -->
  <div class="section">
    <div class="section-header" onclick="toggleSection('income')">
      <h2>💰 Income</h2>
      <div style="display:flex;align-items:center">
        <span class="section-total" style="color:var(--green)" id="incomeTotal">0</span>
        <span class="chevron" id="incomeChevron">▼</span>
      </div>
    </div>
    <div class="section-body" id="incomeBody">
      <div id="incomeRows"></div>
      <button class="add-row-btn" onclick="addRow('income')">＋ Add income source</button>
    </div>
  </div>

  <!-- FIXED EXPENSES -->
  <div class="section">
    <div class="section-header" onclick="toggleSection('fixed')">
      <h2>🏠 Fixed Expenses</h2>
      <div style="display:flex;align-items:center">
        <span class="section-total" style="color:var(--red)" id="fixedTotal">0</span>
        <span class="chevron" id="fixedChevron">▼</span>
      </div>
    </div>
    <div class="section-body" id="fixedBody">
      <div id="fixedRows"></div>
      <button class="add-row-btn" onclick="addRow('fixed')">＋ Add fixed expense</button>
    </div>
  </div>

  <!-- OTHER SPENDING -->
  <div class="section">
    <div class="section-header" onclick="toggleSection('spending')">
      <h2>🛒 Other Spending</h2>
      <div style="display:flex;align-items:center">
        <span class="section-total" style="color:var(--yellow)" id="spendingTotal">0</span>
        <span class="chevron" id="spendingChevron">▼</span>
      </div>
    </div>
    <div class="section-body" id="spendingBody">
      <div class="tabs-row" id="spendingTabs"></div>
      <div id="spendingRows"></div>
      <button class="add-row-btn" onclick="addRow('spending')">＋ Add item</button>
      <button class="add-row-btn" onclick="addSpendingTab()">＋ Add category tab</button>
      <div class="notes-wrap">
        <textarea class="notes-area" placeholder="Notes for this month..." id="monthNotes" oninput="saveNotes()"></textarea>
      </div>
    </div>
  </div>

  <!-- HOUSEHOLD BALANCE -->
  <div class="balance-box">
    <h3>💝 Household Balance</h3>
    <p>For daily expenses, maid pay, fuel &amp; groceries</p>
    <div class="bal-amount" id="householdBalance">0</div>
  </div>

  <!-- CHART -->
  <div class="chart-section">
    <h2>📊 Expense Breakdown</h2>
    <div id="chartBars"></div>
  </div>

</div>

<!-- INSTALL BANNER -->
<div id="installBanner">
  <p>📲 Install Home Budget on your home screen!</p>
  <button onclick="installApp()">Install</button>
  <button id="dismissBtn" onclick="dismissInstall()">✕</button>
</div>

<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let currentDate = new Date();
let data = {};
let deferredPrompt = null;

// PWA install
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem('hb_installDismissed')) {
    document.getElementById('installBanner').classList.add('show');
  }
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('installBanner').classList.remove('show');
    });
  }
}

function dismissInstall() {
  localStorage.setItem('hb_installDismissed', '1');
  document.getElementById('installBanner').classList.remove('show');
}

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(console.error);
}

const defaultIncome = [
  { id:'i1', label:'Pension', amount:'' },
  { id:'i2', label:'Salary', amount:'' },
  { id:'i3', label:'Other Source 1', amount:'' },
  { id:'i4', label:'Other Source 2', amount:'' },
  { id:'i5', label:'Other Source 3', amount:'' },
];
const defaultFixed = [
  { id:'f1', label:'Ammie', amount:'' },
  { id:'f2', label:"Ahmed's School Fee", amount:'' },
  { id:'f3', label:"Mishel's School Fee", amount:'' },
  { id:'f4', label:"Araiz's Uni Fee", amount:'' },
  { id:'f5', label:'Electric Bill', amount:'' },
  { id:'f6', label:'Gas Bill', amount:'' },
  { id:'f7', label:'House Rent', amount:'' },
  { id:'f8', label:'Driver Pay', amount:'' },
  { id:'f9', label:'Golf Club', amount:'' },
  { id:'f10', label:'Caddy', amount:'' },
  { id:'f11', label:'Personal Spending', amount:'' },
  { id:'f12', label:'House Loan', amount:'' },
  { id:'f13', label:'Mobile Packages', amount:'' },
];
const defaultTabs = ['Household','Fuel','Groceries','Maid Pay','Medical','Entertainment'];

function monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

function loadMonth() {
  const key = monthKey(currentDate);
  document.getElementById('monthLabel').textContent = `${MONTHS[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
  const saved = localStorage.getItem('hb_' + key);
  data = saved ? JSON.parse(saved) : {
    income: JSON.parse(JSON.stringify(defaultIncome)),
    fixed: JSON.parse(JSON.stringify(defaultFixed)),
    spendingTabs: [...defaultTabs],
    activeTab: defaultTabs[0],
    spending: Object.fromEntries(defaultTabs.map(t => [t, []])),
    notes: ''
  };
  renderAll();
}

function saveData() { localStorage.setItem('hb_' + monthKey(currentDate), JSON.stringify(data)); }
function saveNotes() { data.notes = document.getElementById('monthNotes').value; saveData(); }
function changeMonth(dir) { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+dir, 1); loadMonth(); }

function fmt(n) { return (parseFloat(n)||0).toLocaleString('en-PK', { maximumFractionDigits:0 }); }
function sum(arr) { return arr.reduce((a,r) => a+(parseFloat(r.amount)||0), 0); }

function renderAll() {
  renderSection('income');
  renderSection('fixed');
  renderSpendingTabs();
  renderSpending();
  renderTotals();
  renderChart();
  document.getElementById('monthNotes').value = data.notes || '';
}

function renderSection(type) {
  const cont = document.getElementById(type+'Rows');
  cont.innerHTML = '';
  data[type].forEach((r,i) => cont.appendChild(makeRow(type,r,i)));
}

function makeRow(type, r, i) {
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = `
    <div class="row-label">
      <input type="text" value="${r.label}" placeholder="Label" onchange="updateLabel('${type}',${i},this.value)">
    </div>
    <input class="amount-input" type="number" inputmode="numeric" value="${r.amount}" placeholder="0"
      oninput="updateAmount('${type}',${i},this.value)">
    <button class="row-delete" onclick="deleteRow('${type}',${i})">✕</button>
  `;
  return div;
}

function updateLabel(type, i, val) {
  if (type==='spending') data.spending[data.activeTab][i].label = val;
  else data[type][i].label = val;
  saveData(); renderTotals(); renderChart();
}

function updateAmount(type, i, val) {
  if (type==='spending') data.spending[data.activeTab][i].amount = val;
  else data[type][i].amount = val;
  saveData(); renderTotals(); renderChart();
}

function deleteRow(type, i) {
  if (type==='spending') data.spending[data.activeTab].splice(i,1);
  else data[type].splice(i,1);
  saveData(); renderAll();
}

function addRow(type) {
  const id = type+Date.now();
  if (type==='spending') {
    if (!data.spending[data.activeTab]) data.spending[data.activeTab]=[];
    data.spending[data.activeTab].push({ id, label:'New Item', amount:'' });
  } else if (type==='income') {
    data.income.push({ id, label:'New Source', amount:'' });
  } else {
    data.fixed.push({ id, label:'New Expense', amount:'' });
  }
  saveData(); renderAll();
}

function renderSpendingTabs() {
  const cont = document.getElementById('spendingTabs');
  cont.innerHTML = '';
  data.spendingTabs.forEach(tab => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn'+(tab===data.activeTab?' active':'');
    btn.textContent = tab;
    btn.onclick = () => { data.activeTab=tab; saveData(); renderSpendingTabs(); renderSpending(); renderTotals(); };
    cont.appendChild(btn);
  });
}

function addSpendingTab() {
  const name = prompt('Enter category name:');
  if (!name || data.spendingTabs.includes(name)) return;
  data.spendingTabs.push(name);
  data.spending[name] = [];
  data.activeTab = name;
  saveData(); renderAll();
}

function renderSpending() {
  const cont = document.getElementById('spendingRows');
  cont.innerHTML = '';
  const tab = data.activeTab;
  if (!data.spending[tab]) data.spending[tab]=[];
  data.spending[tab].forEach((r,i) => cont.appendChild(makeRow('spending',r,i)));
}

function renderTotals() {
  const inc = sum(data.income);
  const fix = sum(data.fixed);
  let spend = 0;
  data.spendingTabs.forEach(t => { if(data.spending[t]) spend+=sum(data.spending[t]); });
  const totalExp = fix+spend;
  const bal = inc-totalExp;

  document.getElementById('totalIncome').textContent = fmt(inc);
  document.getElementById('totalExpenses').textContent = fmt(totalExp);
  document.getElementById('totalBalance').textContent = fmt(bal);
  document.getElementById('incomeTotal').textContent = fmt(inc);
  document.getElementById('fixedTotal').textContent = fmt(fix);
  document.getElementById('spendingTotal').textContent = fmt(spend);

  const hb = document.getElementById('householdBalance');
  hb.textContent = fmt(bal);
  hb.className = 'bal-amount'+(bal<0?' negative':'');
}

function renderChart() {
  const cont = document.getElementById('chartBars');
  cont.innerHTML = '';
  const all = [...data.fixed];
  data.spendingTabs.forEach(t => { if(data.spending[t]) all.push(...data.spending[t]); });
  const rows = all.filter(r => parseFloat(r.amount)>0).sort((a,b)=>b.amount-a.amount).slice(0,10);
  const max = Math.max(...rows.map(r=>parseFloat(r.amount)||0),1);
  const colors = ['#6c8fff','#a78bfa','#34d399','#fbbf24','#f87171','#60a5fa','#fb923c','#c084fc','#4ade80','#f472b6'];
  rows.forEach((r,i) => {
    const pct = Math.max(4, ((parseFloat(r.amount)||0)/max)*100);
    const div = document.createElement('div');
    div.className = 'bar-row';
    div.innerHTML = `
      <div class="bar-label">${r.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${colors[i%colors.length]}"></div></div>
      <div class="bar-val">${fmt(r.amount)}</div>
    `;
    cont.appendChild(div);
  });
  if (!rows.length) cont.innerHTML = '<div style="color:var(--muted);font-size:0.78rem;text-align:center;padding:16px">Enter amounts to see breakdown</div>';
}

function toggleSection(id) {
  document.getElementById(id+'Body').classList.toggle('collapsed');
  document.getElementById(id+'Chevron').parentElement.parentElement.classList.toggle('collapsed');
}

loadMonth();
</script>
</body>
</html>
