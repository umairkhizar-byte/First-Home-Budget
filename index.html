<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home Budget">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest.json">
<title>Home Budget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap');
  :root{--bg:#0f1117;--card:#181c27;--card2:#1e2333;--border:#2a3045;--accent:#6c8fff;--accent2:#a78bfa;--green:#34d399;--red:#f87171;--yellow:#fbbf24;--text:#e8eaf0;--muted:#7a8099;--radius:14px;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}

  /* HEADER */
  .header{background:linear-gradient(135deg,#1a1f35 0%,#0f1117 100%);border-bottom:1px solid var(--border);padding:calc(12px + var(--safe-top)) 16px 12px;position:sticky;top:0;z-index:100;}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .header h1{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--text);}
  .header h1 span{color:var(--accent);}
  .month-nav{display:flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--border);border-radius:40px;overflow:hidden;}
  .month-nav button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:1.1rem;padding:7px 16px;touch-action:manipulation;}
  .month-label{font-size:.85rem;font-weight:600;color:var(--text);min-width:130px;text-align:center;}

  /* SUMMARY */
  .summary-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px;}
  .sum-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px;text-align:center;}
  .sum-card .label{font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px;}
  .sum-card .amount{font-size:1rem;font-weight:700;font-family:'Playfair Display',serif;}
  .sum-card.income .amount{color:var(--green);}
  .sum-card.expenses .amount{color:var(--red);}
  .sum-card.balance .amount{color:var(--accent);}

  /* MAIN */
  .main{padding:0 10px 100px;display:flex;flex-direction:column;gap:12px;}

  /* SECTION */
  .section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .section-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
  .section-header h2{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;}
  .section-header .chevron{color:var(--muted);font-size:.7rem;transition:transform .3s;margin-left:8px;}
  .section-header.collapsed .chevron{transform:rotate(-90deg);}
  .section-body.collapsed{display:none;}

  /* STANDARD ROWS (income / fixed) */
  .row{display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .row-label{flex:1;font-size:.75rem;color:var(--text);min-width:0;}
  .row-label input[type="text"]{background:none;border:none;color:var(--text);font-size:.75rem;font-family:'Inter',sans-serif;width:100%;outline:none;border-bottom:1px solid transparent;}
  .row-label input[type="text"]:focus{border-bottom-color:var(--accent);}
  .amount-input{background:var(--card2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:.75rem;font-family:'Inter',sans-serif;padding:5px 7px;width:95px;text-align:right;outline:none;}
  .amount-input:focus{border-color:var(--accent);}
  .row-delete{background:none;border:none;color:var(--border);cursor:pointer;font-size:.85rem;padding:5px;border-radius:4px;}
  .row-delete:active{color:var(--red);}

  /* ADD BTN */
  .add-row-btn{display:flex;align-items:center;gap:8px;padding:9px 12px;color:var(--muted);font-size:.78rem;cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;width:100%;}
  .add-row-btn:active{color:var(--accent);}

  /* CATEGORY TABS (for extra expenses) */
  .tabs-row{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none;}
  .tabs-row::-webkit-scrollbar{display:none;}
  .tab-btn{background:var(--card2);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:.72rem;padding:4px 11px;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;font-weight:500;}
  .tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* DATE TABS (daily navigation) */
  .date-tabs-bar{display:flex;align-items:center;gap:0;padding:8px 10px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
  .date-tabs-bar::-webkit-scrollbar{display:none;}
  .date-tab{background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:.68rem;padding:5px 9px;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;margin-right:5px;text-align:center;min-width:46px;}
  .date-tab .day-num{font-size:.85rem;font-weight:700;color:var(--text);display:block;}
  .date-tab .day-name{font-size:.58rem;text-transform:uppercase;letter-spacing:.5px;}
  .date-tab.active{background:var(--accent2);border-color:var(--accent2);color:#fff;}
  .date-tab.active .day-num{color:#fff;}
  .date-tab.has-data{border-color:var(--accent);}
  .add-date-btn{background:none;border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-size:.75rem;padding:5px 10px;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;flex-shrink:0;}
  .add-date-btn:active{color:var(--accent);border-color:var(--accent);}

  /* DATE HEADER inside entries */
  .date-header{padding:6px 12px;background:var(--card2);border-bottom:1px solid var(--border);font-size:.7rem;color:var(--accent2);font-weight:600;display:flex;align-items:center;justify-content:space-between;}
  .date-header .del-date-btn{background:none;border:none;color:var(--muted);font-size:.7rem;cursor:pointer;padding:2px 6px;border-radius:4px;}
  .date-header .del-date-btn:active{color:var(--red);}

  /* EXTRA EXPENSE ROWS */
  .extra-row{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--border);}
  .extra-row:last-child{border-bottom:none;}
  .extra-row .row-label{flex:1;font-size:.75rem;color:var(--text);min-width:0;}
  .extra-row .row-label input[type="text"]{background:none;border:none;color:var(--text);font-size:.75rem;font-family:'Inter',sans-serif;width:100%;outline:none;border-bottom:1px solid transparent;}
  .extra-row .row-label input[type="text"]:focus{border-bottom-color:var(--accent2);}
  .extra-row .amount-input{width:90px;}

  /* BALANCE BOX */
  .balance-box{background:linear-gradient(135deg,#1e2a4a,#1a1f35);border:1px solid var(--accent);border-radius:var(--radius);padding:18px 16px;}
  .balance-box h3{font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);margin-bottom:3px;}
  .balance-box p{font-size:.75rem;color:var(--muted);margin-bottom:8px;}
  .balance-box .bal-amount{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;color:var(--accent);}
  .balance-box .bal-amount.negative{color:var(--red);}

  /* CHART */
  .chart-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .chart-section h2{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;margin-bottom:12px;}
  .bar-row{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
  .bar-label{font-size:.68rem;color:var(--muted);width:100px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;background:var(--card2);border-radius:4px;height:8px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;transition:width .5s ease;}
  .bar-val{font-size:.65rem;color:var(--muted);width:60px;text-align:right;}

  /* NOTES */
  .notes-wrap{padding:8px 12px;}
  .notes-area{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:.75rem;color:var(--muted);font-family:'Inter',sans-serif;width:100%;resize:none;min-height:50px;outline:none;}
  .notes-area:focus{border-color:var(--accent);color:var(--text);}

  /* INSTALL BANNER */
  #installBanner{display:none;position:fixed;bottom:calc(16px + var(--safe-bot));left:12px;right:12px;background:var(--accent);color:#fff;border-radius:14px;padding:12px 16px;z-index:999;box-shadow:0 8px 32px rgba(108,143,255,.4);align-items:center;justify-content:space-between;gap:10px;}
  #installBanner.show{display:flex;}
  #installBanner p{font-size:.8rem;font-weight:500;flex:1;}
  #installBanner button{background:#fff;color:var(--accent);border:none;border-radius:8px;padding:6px 12px;font-weight:700;font-size:.8rem;cursor:pointer;}
  #dismissBtn{background:none;color:rgba(255,255,255,.7);font-size:1rem;padding:4px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>Home <span>Budget</span></h1>
  </div>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">&#8592;</button>
    <div class="month-label" id="monthLabel"></div>
    <button onclick="changeMonth(1)">&#8594;</button>
  </div>
</div>

<div class="summary-row">
  <div class="sum-card income"><div class="label">Income</div><div class="amount" id="totalIncome">0</div></div>
  <div class="sum-card expenses"><div class="label">Expenses</div><div class="amount" id="totalExpenses">0</div></div>
  <div class="sum-card balance"><div class="label">Balance</div><div class="amount" id="totalBalance">0</div></div>
</div>

<div class="main">

  <!-- INCOME -->
  <div class="section">
    <div class="section-header" onclick="toggleSection('income')">
      <h2>💰 Income</h2>
      <div style="display:flex;align-items:center">
        <span style="color:var(--green);font-size:.9rem;font-weight:700" id="incomeTotal">0</span>
        <span class="chevron" id="incomeChevron">▼</span>
      </div>
    </div>
    <div class="section-body" id="incomeBody">
      <div id="incomeRows"></div>
      <button class="add-row-btn" onclick="addRow('income')">＋ Add income source</button>
    </div>
  </div>

  <!-- FIXED EXPENSES UMAIR -->
  <div class="section">
    <div class="section-header" onclick="toggleSection('fixedU')">
      <h2>🧔 Fixed Expenses Umair</h2>
      <div style="display:flex;align-items:center">
        <span style="color:var(--red);font-size:.9rem;font-weight:700" id="fixedUTotal">0</span>
        <span class="chevron" id="fixedUChevron">▼</span>
      </div>
    </div>
    <div class="section-body" id="fixedUBody">
      <div id="fixedURows"></div>
      <button class="add-row-btn" onclick="addRow('fixedU')">＋ Add expense</button>
    </div>
  </div>

  <!-- FIXED EXPENSES HOUSEHOLD -->
  <div class="section">
    <div class="section-header" onclick="toggleSection('fixedH')">
      <h2>🏠 Fixed Expenses Household</h2>
      <div style="display:flex;align-items:center">
        <span style="color:var(--red);font-size:.9rem;font-weight:700" id="fixedHTotal">0</span>
        <span class="chevron" id="fixedHChevron">▼</span>
      </div>
    </div>
    <div class="section-body" id="fixedHBody">
      <div id="fixedHRows"></div>
      <button class="add-row-btn" onclick="addRow('fixedH')">＋ Add expense</button>
    </div>
  </div>

  <!-- EXTRA EXPENSES HOUSEHOLD -->
  <div class="section">
    <div class="section-header" onclick="toggleSection('extra')">
      <h2>🛒 Extra Expenses Household</h2>
      <div style="display:flex;align-items:center">
        <span style="color:var(--yellow);font-size:.9rem;font-weight:700" id="extraTotal">0</span>
        <span class="chevron" id="extraChevron">▼</span>
      </div>
    </div>
    <div class="section-body" id="extraBody">
      <!-- Category tabs -->
      <div class="tabs-row" id="extraCatTabs"></div>
      <!-- Date tabs -->
      <div class="date-tabs-bar" id="extraDateTabs"></div>
      <!-- Add date row - always visible input -->
      <div style="display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--card2);">
        <span style="font-size:.72rem;color:var(--muted);white-space:nowrap;">Add date:</span>
        <input type="date" id="newDatePicker" style="flex:1;background:var(--card);border:1px solid var(--accent2);border-radius:7px;color:var(--text);font-size:.75rem;padding:5px 8px;outline:none;font-family:Inter,sans-serif;" onchange="addDateFromPicker(this.value)">
      </div>
      <!-- Entries for selected date -->
      <div id="extraRows"></div>
      <button class="add-row-btn" onclick="addExtraRow()">＋ Add item</button>
      <div class="notes-wrap">
        <textarea class="notes-area" placeholder="Notes..." id="monthNotes" oninput="saveNotes()"></textarea>
      </div>
    </div>
  </div>

  <!-- HOUSEHOLD BALANCE -->
  <div class="balance-box">
    <h3>💝 Household Balance</h3>
    <p>Remaining after all fixed expenses</p>
    <div class="bal-amount" id="householdBalance">0</div>
  </div>

  <!-- CHART -->
  <div class="chart-section">
    <h2>📊 Expense Breakdown</h2>
    <div id="chartBars"></div>
  </div>

</div>

<div id="installBanner">
  <p>📲 Install Home Budget!</p>
  <button onclick="installApp()">Install</button>
  <button id="dismissBtn" onclick="dismissInstall()">✕</button>
</div>

<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let currentDate=new Date(), data={}, deferredPrompt=null;

// PWA install
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!localStorage.getItem('hb_installDismissed'))document.getElementById('installBanner').classList.add('show');});
function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('installBanner').classList.remove('show');});}}
function dismissInstall(){localStorage.setItem('hb_installDismissed','1');document.getElementById('installBanner').classList.remove('show');}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.error);

// DEFAULTS
const defaultIncome=[
  {id:'i1',label:'Pension',amount:''},
  {id:'i2',label:'Salary',amount:''},
  {id:'i3',label:'Other Source 1',amount:''},
  {id:'i4',label:'Other Source 2',amount:''},
  {id:'i5',label:'Other Source 3',amount:''}
];
const defaultFixedU=[
  {id:'f1',label:'Ammie',amount:''},
  {id:'f2',label:"Ahmed's School Fee",amount:''},
  {id:'f3',label:"Mishel's School Fee",amount:''},
  {id:'f4',label:"Araiz's Uni Fee",amount:''},
  {id:'f5',label:'Electric Bill',amount:''},
  {id:'f6',label:'Gas Bill',amount:''},
  {id:'f7',label:'Golf Club',amount:''},
  {id:'f8',label:'Caddy',amount:''},
  {id:'f9',label:'Personal Spending',amount:''},
  {id:'f10',label:'House Loan',amount:''},
  {id:'f11',label:'Mobile Packages',amount:''}
];
const defaultFixedH=[
  {id:'h1',label:'House Rent',amount:''},
  {id:'h2',label:'Driver Pay',amount:''}
];
const defaultExtraCats=['Kids','Veggies & Fruits','Daily Expense','Extra Expense','Charity'];

function today(){return new Date().toISOString().split('T')[0];}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

function freshData(){
  return {
    income:JSON.parse(JSON.stringify(defaultIncome)),
    fixedU:JSON.parse(JSON.stringify(defaultFixedU)),
    fixedH:JSON.parse(JSON.stringify(defaultFixedH)),
    extraCats:[...defaultExtraCats],
    activeCat:defaultExtraCats[0],
    // extra: { cat: { date: [ {id,label,amount} ] } }
    extra:{},
    activeDate:today(),
    notes:''
  };
}

function loadMonth(){
  const key=monthKey(currentDate);
  document.getElementById('monthLabel').textContent=MONTHS[currentDate.getMonth()]+' '+currentDate.getFullYear();
  const saved=localStorage.getItem('hb_'+key);
  data=saved?JSON.parse(saved):freshData();
  // ensure all cats exist
  data.extraCats.forEach(c=>{if(!data.extra[c])data.extra[c]={};});
  // if activeDate not set, use today
  if(!data.activeDate)data.activeDate=today();
  renderAll();
}

function saveData(){localStorage.setItem('hb_'+monthKey(currentDate),JSON.stringify(data));}
function saveNotes(){data.notes=document.getElementById('monthNotes').value;saveData();}
function changeMonth(dir){currentDate=new Date(currentDate.getFullYear(),currentDate.getMonth()+dir,1);loadMonth();}
function fmt(n){return(parseFloat(n)||0).toLocaleString('en-PK',{maximumFractionDigits:0});}
function sum(arr){return arr.reduce((a,r)=>a+(parseFloat(r.amount)||0),0);}

function renderAll(){
  renderSection('income');
  renderSection('fixedU');
  renderSection('fixedH');
  renderExtraCatTabs();
  renderExtraDateTabs();
  renderExtraRows();
  renderTotals();
  renderChart();
  document.getElementById('monthNotes').value=data.notes||'';
}

// STANDARD SECTION ROWS
function renderSection(type){
  const c=document.getElementById(type+'Rows');
  c.innerHTML='';
  data[type].forEach((r,i)=>c.appendChild(makeStdRow(type,r,i)));
}

function makeStdRow(type,r,i){
  const d=document.createElement('div');
  d.className='row';
  d.innerHTML='<div class="row-label"><input type="text" value="'+escQ(r.label)+'" placeholder="Label" onchange="updateStdLabel(\''+type+'\','+i+',this.value)"></div>'
    +'<input class="amount-input" type="number" inputmode="numeric" value="'+r.amount+'" placeholder="0" oninput="updateStdAmount(\''+type+'\','+i+',this.value)">'
    +'<button class="row-delete" onclick="deleteStdRow(\''+type+'\','+i+')">✕</button>';
  return d;
}

function updateStdLabel(type,i,val){data[type][i].label=val;saveData();renderTotals();renderChart();}
function updateStdAmount(type,i,val){data[type][i].amount=val;saveData();renderTotals();renderChart();}
function deleteStdRow(type,i){data[type].splice(i,1);saveData();renderSection(type);renderTotals();renderChart();}
function addRow(type){data[type].push({id:type+Date.now(),label:'New Item',amount:''});saveData();renderSection(type);renderTotals();}

// EXTRA EXPENSES - CATEGORY TABS
function renderExtraCatTabs(){
  const c=document.getElementById('extraCatTabs');
  c.innerHTML='';
  data.extraCats.forEach(cat=>{
    const b=document.createElement('button');
    b.className='tab-btn'+(cat===data.activeCat?' active':'');
    b.textContent=cat;
    b.onclick=()=>{data.activeCat=cat;saveData();renderExtraCatTabs();renderExtraDateTabs();renderExtraRows();renderTotals();};
    c.appendChild(b);
  });
}

// EXTRA EXPENSES - DATE TABS (the key feature)
function renderExtraDateTabs(){
  const c=document.getElementById('extraDateTabs');
  c.innerHTML='';
  const cat=data.activeCat;
  if(!data.extra[cat])data.extra[cat]={};

  // Collect all dates that have entries for this cat
  const datesWithData=Object.keys(data.extra[cat]).sort();

  // Also include activeDate even if empty
  const allDates=[...new Set([...datesWithData, data.activeDate])].sort();

  allDates.forEach(dateStr=>{
    const d=new Date(dateStr+'T00:00:00');
    const btn=document.createElement('div');
    const hasData=data.extra[cat][dateStr]&&data.extra[cat][dateStr].length>0;
    btn.className='date-tab'+(dateStr===data.activeDate?' active':'')+(hasData?' has-data':'');
    btn.innerHTML='<span class="day-num">'+d.getDate()+'</span><span class="day-name">'+DAYS[d.getDay()]+'</span>';
    btn.onclick=()=>{data.activeDate=dateStr;saveData();renderExtraDateTabs();renderExtraRows();};
    c.appendChild(btn);
  });

  // Set newDatePicker to today if empty
  const picker=document.getElementById('newDatePicker');
  if(picker&&!picker.value)picker.value=today();

  // Scroll active tab into view
  setTimeout(()=>{
    const active=c.querySelector('.date-tab.active');
    if(active)active.scrollIntoView({inline:'center',behavior:'smooth'});
  },50);
}

// EXTRA EXPENSES - ROWS FOR ACTIVE DATE
function renderExtraRows(){
  const c=document.getElementById('extraRows');
  c.innerHTML='';
  const cat=data.activeCat;
  const dateStr=data.activeDate;
  if(!data.extra[cat])data.extra[cat]={};
  if(!data.extra[cat][dateStr])data.extra[cat][dateStr]=[];
  const entries=data.extra[cat][dateStr];

  // Show date label at top
  if(dateStr){
    const d=new Date(dateStr+'T00:00:00');
    const hdr=document.createElement('div');
    hdr.className='date-header';
    hdr.innerHTML='<span>'+d.toLocaleDateString('en-PK',{weekday:'long',day:'numeric',month:'long'})+'</span>'
      +'<button class="del-date-btn" onclick="deleteDate()">🗑 Remove date</button>';
    c.appendChild(hdr);
  }

  entries.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='extra-row';
    d.innerHTML='<div class="row-label"><input type="text" value="'+escQ(r.label)+'" placeholder="Description" onchange="updateExtraLabel('+i+',this.value)"></div>'
      +'<input class="amount-input" type="number" inputmode="numeric" value="'+r.amount+'" placeholder="0" oninput="updateExtraAmount('+i+',this.value)">'
      +'<button class="row-delete" onclick="deleteExtraRow('+i+')">✕</button>';
    c.appendChild(d);
  });
}

function updateExtraLabel(i,val){const cat=data.activeCat,dt=data.activeDate;data.extra[cat][dt][i].label=val;saveData();renderTotals();renderChart();}
function updateExtraAmount(i,val){const cat=data.activeCat,dt=data.activeDate;data.extra[cat][dt][i].amount=val;saveData();renderTotals();renderChart();}
function deleteExtraRow(i){const cat=data.activeCat,dt=data.activeDate;data.extra[cat][dt].splice(i,1);saveData();renderExtraRows();renderTotals();renderChart();}
function deleteDate(){
  const cat=data.activeCat,dt=data.activeDate;
  if(!confirm('Remove '+dt+' and all its entries?'))return;
  delete data.extra[cat][dt];
  // switch to another date or today
  const remaining=Object.keys(data.extra[cat]).sort();
  data.activeDate=remaining.length?remaining[remaining.length-1]:today();
  saveData();renderExtraDateTabs();renderExtraRows();renderTotals();renderChart();
}
function addExtraRow(){
  const cat=data.activeCat,dt=data.activeDate;
  if(!data.extra[cat])data.extra[cat]={};
  if(!data.extra[cat][dt])data.extra[cat][dt]=[];
  data.extra[cat][dt].push({id:'e'+Date.now(),label:'',amount:''});
  saveData();renderExtraRows();renderTotals();
}

// TOTALS
function renderTotals(){
  const inc=sum(data.income);
  const fixU=sum(data.fixedU);
  const fixH=sum(data.fixedH);
  let extra=0;
  data.extraCats.forEach(cat=>{
    if(data.extra[cat])Object.values(data.extra[cat]).forEach(dayArr=>{ extra+=sum(dayArr); });
  });
  const totalExp=fixU+fixH+extra;
  const bal=inc-totalExp;
  document.getElementById('totalIncome').textContent=fmt(inc);
  document.getElementById('totalExpenses').textContent=fmt(totalExp);
  document.getElementById('totalBalance').textContent=fmt(bal);
  document.getElementById('incomeTotal').textContent=fmt(inc);
  document.getElementById('fixedUTotal').textContent=fmt(fixU);
  document.getElementById('fixedHTotal').textContent=fmt(fixH);
  document.getElementById('extraTotal').textContent=fmt(extra);
  const hb=document.getElementById('householdBalance');
  hb.textContent=fmt(bal);
  hb.className='bal-amount'+(bal<0?' negative':'');
}

// CHART
function renderChart(){
  const c=document.getElementById('chartBars');c.innerHTML='';
  const all=[...data.fixedU,...data.fixedH];
  data.extraCats.forEach(cat=>{
    if(data.extra[cat])Object.values(data.extra[cat]).forEach(arr=>all.push(...arr));
  });
  const rows=all.filter(r=>parseFloat(r.amount)>0).sort((a,b)=>b.amount-a.amount).slice(0,10);
  const max=Math.max(...rows.map(r=>parseFloat(r.amount)||0),1);
  const colors=['#6c8fff','#a78bfa','#34d399','#fbbf24','#f87171','#60a5fa','#fb923c','#c084fc','#4ade80','#f472b6'];
  rows.forEach((r,i)=>{
    const pct=Math.max(4,((parseFloat(r.amount)||0)/max)*100);
    const d=document.createElement('div');d.className='bar-row';
    d.innerHTML='<div class="bar-label">'+r.label+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+colors[i%colors.length]+'"></div></div><div class="bar-val">'+fmt(r.amount)+'</div>';
    c.appendChild(d);
  });
  if(!rows.length)c.innerHTML='<div style="color:var(--muted);font-size:.75rem;text-align:center;padding:14px">Enter amounts to see breakdown</div>';
}

// TOGGLE SECTIONS
function toggleSection(id){
  document.getElementById(id+'Body').classList.toggle('collapsed');
  document.getElementById(id+'Chevron').parentElement.parentElement.classList.toggle('collapsed');
}

function addDateFromPicker(val){
  if(!val)return;
  const cat=data.activeCat;
  if(!data.extra[cat])data.extra[cat]={};
  if(!data.extra[cat][val])data.extra[cat][val]=[];
  data.activeDate=val;
  saveData();
  renderExtraDateTabs();
  renderExtraRows();
  // reset picker so same date can be re-selected if needed
  const picker=document.getElementById('newDatePicker');
  if(picker)picker.value='';
}
function escQ(s){return (s||'').replace(/"/g,'&quot;');}

loadMonth();
